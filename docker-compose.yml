

services:
  # Database Service (Postgres)
  db:
    image: postgres:17-alpine
    container_name: palmops-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-palm_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-palm_pass}
      POSTGRES_DB: ${DB_NAME:-palm_ops_db}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-palm_admin} -d $${POSTGRES_DB:-palm_ops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./bk_plam-ops.dump:/docker-entrypoint-initdb.d/bk_plam-ops.dump:ro
      - ./restore-db.sh:/docker-entrypoint-initdb.d/restore-db.sh:ro

  # Backend Service (Node.js/Prisma/Express)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: palmops-backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-palm_admin}:${DB_PASSWORD:-palm_pass}@db:5432/${DB_NAME:-palm_ops_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-palmops_secret_key_2026}
      - PORT=5001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  # Frontend Service (React/Vite/Nginx)
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: palmops-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
